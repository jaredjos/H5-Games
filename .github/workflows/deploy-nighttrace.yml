name: Deploy Nighttrace

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - games/nighttrace/**
      - .github/pages/nighttrace-versions/**
      - .github/workflows/deploy-nighttrace.yml

permissions:
  contents: write

concurrency:
  group: deploy-nighttrace
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: games/nighttrace/pnpm-lock.yaml

      - name: Check out isolated v1.18.0 source
        shell: bash
        run: |
          git fetch origin \
            nighttrace-v1.18-playable:refs/remotes/origin/nighttrace-v1.18-playable
          git worktree add --detach /tmp/nighttrace-v118 \
            origin/nighttrace-v1.18-playable

      - name: Install stable dependencies
        working-directory: games/nighttrace
        run: pnpm install --frozen-lockfile

      - name: Package authored cinematic narration
        working-directory: games/nighttrace
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

          mkdir -p public/assets/cinematics/audio /tmp/nighttrace-voice
          curl --fail --silent --show-error --location --retry 4 \
            "https://resource2.heygen.ai/text_to_speech/eff3caa328f246b192c5cc03e7f2d48a/0fe77e0eee104bc78469a57bbe1a6550/id=d39ed1ef-e7fe-4b5d-b3e0-11d8c3bb0d19.wav" \
            --output /tmp/nighttrace-voice/last-star.wav
          curl --fail --silent --show-error --location --retry 4 \
            "https://resource2.heygen.ai/text_to_speech/eff3caa328f246b192c5cc03e7f2d48a/0a0b38624ac64ec6afcd5842a977ca10/id=9aa06026-f195-4240-ac7f-662c321d8792.wav" \
            --output /tmp/nighttrace-voice/bearer.wav
          curl --fail --silent --show-error --location --retry 4 \
            "https://resource2.heygen.ai/text_to_speech/eff3caa328f246b192c5cc03e7f2d48a/054af44a167344d0af2722fdfef08d17/id=96c84639-68a6-4181-a103-ec628a0e985c.wav" \
            --output /tmp/nighttrace-voice/sun-eater.wav

          for actor in last-star bearer sun-eater; do
            ffmpeg -hide_banner -loglevel error -y \
              -i "/tmp/nighttrace-voice/${actor}.wav" \
              -map_metadata -1 -ac 1 -ar 44100 -codec:a libmp3lame -b:a 96k \
              "public/assets/cinematics/audio/${actor}.mp3"
          done

      - name: Test, lint, and build stable v1.19.0
        working-directory: games/nighttrace
        run: |
          pnpm test
          pnpm lint
          pnpm build

      - name: Install isolated v1.18.0 dependencies
        working-directory: /tmp/nighttrace-v118/games/nighttrace
        run: pnpm install --frozen-lockfile

      - name: Test, lint, and build isolated v1.18.0
        working-directory: /tmp/nighttrace-v118/games/nighttrace
        run: |
          pnpm test
          pnpm lint
          pnpm build

      - name: Publish both Nighttrace builds and selector
        shell: bash
        run: |
          STABLE_VERSION="$(node -p "require('./games/nighttrace/package.json').version")"
          ISOLATED_VERSION="$(node -p "require('/tmp/nighttrace-v118/games/nighttrace/package.json').version")"
          git fetch origin gh-pages:refs/remotes/origin/gh-pages
          git worktree add --detach /tmp/h5-pages origin/gh-pages

          rm -rf \
            /tmp/h5-pages/nighttrace \
            /tmp/h5-pages/nighttrace-v1.18.0 \
            /tmp/h5-pages/nighttrace-versions
          mkdir -p \
            /tmp/h5-pages/nighttrace \
            /tmp/h5-pages/nighttrace-v1.18.0 \
            /tmp/h5-pages/nighttrace-versions

          cp -a games/nighttrace/dist/. /tmp/h5-pages/nighttrace/
          cp -a /tmp/nighttrace-v118/games/nighttrace/dist/. \
            /tmp/h5-pages/nighttrace-v1.18.0/
          cp -a .github/pages/nighttrace-versions/. \
            /tmp/h5-pages/nighttrace-versions/
          touch /tmp/h5-pages/.nojekyll

          cd /tmp/h5-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            nighttrace \
            nighttrace-v1.18.0 \
            nighttrace-versions \
            .nojekyll

          if git diff --cached --quiet; then
            echo "Both Nighttrace Pages builds are already current."
            exit 0
          fi

          git commit -m \
            "deploy(nighttrace): publish v${STABLE_VERSION} and v${ISOLATED_VERSION}"
          git push origin HEAD:gh-pages
