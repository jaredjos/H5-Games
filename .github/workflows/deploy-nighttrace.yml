name: Deploy Nighttrace

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - games/nighttrace/**
      - .github/pages/nighttrace-versions/**
      - .github/workflows/deploy-nighttrace.yml

permissions:
  contents: write

concurrency:
  group: deploy-nighttrace
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: games/nighttrace/pnpm-lock.yaml

      - name: Install stable dependencies
        working-directory: games/nighttrace
        run: pnpm install --frozen-lockfile

      - name: Test, lint, and build stable v1.23.1
        working-directory: games/nighttrace
        run: |
          pnpm test
          pnpm lint
          pnpm build

      - name: Publish stable Nighttrace build and selector
        shell: bash
        run: |
          STABLE_VERSION="$(node -p "require('./games/nighttrace/package.json').version")"
          git fetch origin gh-pages:refs/remotes/origin/gh-pages
          git worktree add --detach /tmp/h5-pages origin/gh-pages

          rm -rf \
            /tmp/h5-pages/nighttrace \
            /tmp/h5-pages/nighttrace-v1.18.0 \
            /tmp/h5-pages/nighttrace-versions
          mkdir -p \
            /tmp/h5-pages/nighttrace \
            /tmp/h5-pages/nighttrace-versions

          cp -a games/nighttrace/dist/. /tmp/h5-pages/nighttrace/
          cp -a .github/pages/nighttrace-versions/. \
            /tmp/h5-pages/nighttrace-versions/
          touch /tmp/h5-pages/.nojekyll

          cd /tmp/h5-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            nighttrace \
            nighttrace-versions \
            .nojekyll

          if git diff --cached --quiet; then
            echo "The stable Nighttrace Pages build is already current."
            exit 0
          fi

          git commit -m \
            "deploy(nighttrace): publish stable v${STABLE_VERSION}"
          git push origin HEAD:gh-pages
